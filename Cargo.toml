[package]
name = "cleanmic"
version = "1.0.7"
edition = "2024"
description = "A Linux desktop app providing a clean virtual microphone with switchable noise suppression"
license = "MIT"

[features]
default = []
gui = ["dep:gtk4", "dep:libadwaita"]
pipewire = ["dep:pipewire"]
tray = ["dep:ksni"]
rnnoise = ["dep:nnnoiseless"]
deepfilter = ["dep:nnnoiseless"]
updater = ["dep:ureq", "dep:semver"]
# Throwaway/experimental real-time DPDFNet adapter (D-07) — never in `default`.
# Not registered in EngineType/create_engine; exists only to feed real-pipeline
# measurements to Plan 06's ship-gate decision. See src/engine/dpdfnet_experimental.rs.
dpdfnet-experimental = ["dep:ort"]
# Production DPDFNet-2/8 engine (Phase 15.1, Plan 04 — D-01/D-02). Registered
# in EngineType/create_engine. Requires the owner-approved `realfft` crate
# (15.1-02-SUMMARY.md, "approved realfft 3.5.0") in addition to `ort`.
# See src/engine/dpdfnet.rs.
dpdfnet = ["dep:ort", "dep:realfft"]

[dependencies]
# Core (always available)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
libloading = "0.8"
libc = "0.2"
gettext-rs = { version = "0.7", features = ["gettext-system"] }

# Optional: GUI
gtk4 = { version = "0.9", optional = true }
libadwaita = { version = "0.7", optional = true, features = ["v1_5"] }

# Optional: Noise suppression
nnnoiseless = { version = "0.5", optional = true }

# Optional: Audio
pipewire = { version = "0.8", optional = true, features = ["v0_3_32"] }

# Optional: System tray
ksni = { version = "0.2", optional = true }

# Optional: Update checker
ureq = { version = "3", optional = true, features = ["json"] }
semver = { version = "1", optional = true }

# Optional, gated behind dpdfnet-experimental — checkpoint:human-verify approved
# (see .planning/phases/15-full-model-evaluation-conditional-dpdfnet-integration/
# 15-LICENSING-EVIDENCE.md, "ort Rust crate (Plan 05 — checkpoint approved)").
# default-features = false avoids `download-binaries` (which would fetch a
# prebuilt ONNX Runtime archive at build time); we only want `load-dynamic`,
# which dlopens the system/local libonnxruntime.so at runtime instead,
# mirroring the khip/deepfilter dlopen pattern. `api-24` is required explicitly
# because ort compiles OrtApi struct field access against a specific C API
# version — without it, code paths compiled unconditionally under
# `feature = "load-dynamic"` (e.g. ep/vitis.rs) reference struct fields that
# don't exist at the (otherwise unset) baseline API level. ONNX Runtime's
# GetApi() is backward-compatible (a newer runtime serves older API version
# requests), so requesting api-24 against the pinned v1.27.0 .so is expected
# to work — verified empirically in Task 2/3, not assumed.
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = [
    "load-dynamic",
    "api-24",
] }

# Real FFT for the production DPDFNet adapter's 960-point Vorbis-windowed
# analysis/synthesis (Plan 04). Owner-approved 2026-07-24
# (.planning/phases/15.1-dpdfnet-production-integration-and-engine-selection/
# 15.1-02-SUMMARY.md, verbatim: "approved realfft 3.5.0"). Pinned to exactly
# 3.5.0 per that approval — not a caret range.
realfft = { version = "=3.5.0", optional = true }

[dev-dependencies]
tempfile = "3"
